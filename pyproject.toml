[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "quickerwrite-documents-skills"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1", "pypdfium2>=4.30", "Pillow>=10", "python-pptx>=1.0", "python-docx>=1.1"]
[project.scripts]
qw-documents-worker = "document_skills.worker:main"
[tool.setuptools.packages.find]
include = ["document_skills*"]
